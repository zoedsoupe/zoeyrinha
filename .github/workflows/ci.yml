name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  yby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://zoedsoupe.cachix.org https://elixir-overlay.cachix.org
            extra-trusted-public-keys = zoedsoupe.cachix.org-1:Qsa6hA95F/Ny+lPEyq1FYtjmQL1+os4jTUSvf6GVzLs= elixir-overlay.cachix.org-1:03zcUxISSuNn2vnKPfUJFinDGU5vzhyc+cPbB7u77xA=

      - uses: cachix/cachix-action@v15
        with:
          name: zoedsoupe
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name != 'push' }}

      - name: Build yby
        run: nix build .#nixosConfigurations.yby.config.system.build.toplevel

  personal-mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://zoedsoupe.cachix.org https://elixir-overlay.cachix.org
            extra-trusted-public-keys = zoedsoupe.cachix.org-1:Qsa6hA95F/Ny+lPEyq1FYtjmQL1+os4jTUSvf6GVzLs= elixir-overlay.cachix.org-1:03zcUxISSuNn2vnKPfUJFinDGU5vzhyc+cPbB7u77xA=

      - uses: cachix/cachix-action@v15
        with:
          name: zoedsoupe
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name != 'push' }}

      - name: Verify ARM64 runner
        run: test "$(uname -m)" = arm64

      - name: Build personal-mac
        run: nix build .#darwinConfigurations.zoedsoupe-mac.system
