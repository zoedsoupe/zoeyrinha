name: atuin

services:
  atuin:
    image: ghcr.io/atuinsh/atuin:18.24.4
    command: start
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - /zdata/atuin/config:/config
    environment:
      ATUIN_HOST: "0.0.0.0"
      ATUIN_PORT: "8888"
      ATUIN_OPEN_REGISTRATION: "true"
      ATUIN_DB_URI: "sqlite:///config/atuin.db"
      RUST_LOG: "info,atuin_server=debug"
